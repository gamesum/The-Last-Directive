<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>The Last Directive</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #08070a; overflow: hidden;
        font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        color: #cfd6d8;
        -webkit-user-select: none; user-select: none;
        touch-action: none;
      }
      #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas#screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        box-shadow: 0 0 60px rgba(0,0,0,.9);
      }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #08070a; z-index: 10; text-align: center; line-height: 1.7;
        font-size: 13px; letter-spacing: .08em;
      }
      #boot b { display:block; font-size: 20px; letter-spacing:.3em; margin-bottom:14px; color:#e8b26a; font-weight:600 }
      #boot span { opacity:.55 }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="screen"></canvas></div>
    <div id="boot"><div><b>THE LAST DIRECTIVE</b><span>loading&hellip;</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

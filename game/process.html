<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Art processor</title>
    <style>
      body { background:#12131a; color:#cfd6d8; font:13px ui-monospace,monospace; padding:20px }
      #log { white-space:pre-wrap; line-height:1.6 }
      canvas { image-rendering:pixelated; background:#222; margin:4px; vertical-align:bottom }
    </style>
  </head>
  <body>
    <div id="log">idle</div>
    <div id="out"></div>
    <script type="module">
/**
 * One-off asset pipeline for the AI-generated sprites.
 *
 * The image models can't emit alpha, so everything is generated on a flat
 * magenta field. This knocks that out, trims to the content box, and
 * downsamples to the size the sprite is actually drawn at in game — which is
 * what the original did too: detailed art, displayed small.
 *
 * Open /process.html and it runs. Re-runnable and idempotent.
 */
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const out = document.getElementById('out');

const load = (src) => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  i.onerror = () => rej(new Error('load failed: ' + src));
  i.src = src;
});

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d', { willReadFrequently: true })];
}

/** Knock out the magenta field and return the trimmed content box. */
function keyAndTrim(img, sx = 0, sy = 0, sw = img.width, sh = img.height) {
  const [c, g] = cv(sw, sh);
  g.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const d = g.getImageData(0, 0, sw, sh);
  const p = d.data;
  let minX = sw, minY = sh, maxX = -1, maxY = -1;

  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], gg = p[i + 1], b = p[i + 2];
    // magenta: red and blue both high, green comparatively low
    const isKey = r > 140 && b > 140 && gg < 130 && (r - gg) > 55 && (b - gg) > 55;
    if (isKey) { p[i + 3] = 0; continue; }
    const px = (i / 4) % sw, py = (i / 4 / sw) | 0;
    if (px < minX) minX = px;
    if (py < minY) minY = py;
    if (px > maxX) maxX = px;
    if (py > maxY) maxY = py;
  }
  g.putImageData(d, 0, 0);
  if (maxX < 0) return null;

  const tw = maxX - minX + 1, th = maxY - minY + 1;
  const [t, tg] = cv(tw, th);
  tg.drawImage(c, minX, minY, tw, th, 0, 0, tw, th);
  return t;
}

/** Halve repeatedly, then land on the target — much cleaner than one jump. */
function downscale(src, targetW, targetH) {
  let cur = src;
  while (cur.width / 2 > targetW && cur.height / 2 > targetH) {
    const [h, hg] = cv(Math.max(1, cur.width >> 1), Math.max(1, cur.height >> 1));
    hg.imageSmoothingEnabled = true;
    hg.imageSmoothingQuality = 'high';
    hg.drawImage(cur, 0, 0, h.width, h.height);
    cur = h;
  }
  const [f, fg] = cv(targetW, targetH);
  fg.imageSmoothingEnabled = true;
  fg.imageSmoothingQuality = 'high';
  fg.drawImage(cur, 0, 0, targetW, targetH);
  return f;
}

/** Contiguous runs of set flags, ignoring gaps shorter than `minGap`. */
function runs(mask, n, minGap = 8) {
  const out = [];
  let start = -1, gap = 0;
  for (let i = 0; i < n; i++) {
    if (mask[i]) { if (start < 0) start = i; gap = 0; }
    else if (start >= 0 && ++gap >= minGap) { out.push([start, i - gap]); start = -1; }
  }
  if (start >= 0) out.push([start, n - 1]);
  return out;
}

/**
 * Split a chroma-key sheet into its individual subjects, in reading order.
 *
 * The image model does NOT reliably honour a requested grid — the same prompt
 * produced 4x2 for one sheet and 3x3 for another — so slicing at fixed
 * fractions cut straight through the artwork. This projects the non-magenta
 * pixels onto each axis instead and finds the real gaps, which works for any
 * arrangement as long as the subjects don't touch.
 */
function splitSheet(img) {
  const W = img.width, H = img.height;
  const [c, g] = cv(W, H);
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;

  // Counts as content if it is neither the magenta field nor near-black.
  // Some sheets come back with black ruled lines drawn between the cells,
  // which weld every subject into one blob if you count them — the tanks
  // sheet collapsed to a single 'subject' before this. Item outlines are
  // near-black too, but their interiors are not, so real subjects survive.
  const content = (x, y) => {
    const i = (y * W + x) * 4;
    const r = d[i], gg = d[i + 1], b = d[i + 2];
    if (r > 140 && b > 140 && gg < 130 && (r - gg) > 55 && (b - gg) > 55) return false;
    return Math.max(r, gg, b) > 60;
  };

  const rowHas = new Uint8Array(H);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) if (content(x, y)) { rowHas[y] = 1; break; }

  // Give each box a little slack so the subject's own dark outline, which the
  // projection deliberately ignored, isn't clipped off.
  const PAD = 4;
  const out = [];
  for (const [ry0, ry1] of runs(rowHas, H)) {
    const y0 = Math.max(0, ry0 - PAD), y1 = Math.min(H - 1, ry1 + PAD);
    const colHas = new Uint8Array(W);
    for (let x = 0; x < W; x++)
      for (let y = y0; y <= y1; y++) if (content(x, y)) { colHas[x] = 1; break; }
    for (const [rx0, rx1] of runs(colHas, W)) {
      const x0 = Math.max(0, rx0 - PAD), x1 = Math.min(W - 1, rx1 + PAD);
      const t = keyAndTrim(img, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      if (t && t.width > 10 && t.height > 10) out.push(t);
    }
  }

  return out;
}

/**
 * Drop fragments — slivers left by a subject with a detached part, like the
 * pipe bridging a twin fuel tank.
 *
 * Only worth doing when there are more subjects than tiers. Applied
 * unconditionally it eats real content: the smallest tank in an ascending
 * ladder is genuinely tiny, and a blanket size threshold threw it away.
 */
function dropFragments(items) {
  const areas = items.map((c) => c.width * c.height).sort((a, b) => a - b);
  const median = areas[areas.length >> 1];
  return items.filter((c) => c.width * c.height >= median * 0.3);
}

/** Fit inside a box, preserving aspect. */
function fit(src, boxW, boxH) {
  const s = Math.min(boxW / src.width, boxH / src.height);
  return downscale(src, Math.max(1, Math.round(src.width * s)), Math.max(1, Math.round(src.height * s)));
}

async function save(canvas, name) {
  await fetch('/__shot?into=art&name=' + name, {
    method: 'POST', body: canvas.toDataURL('image/png'),
  });
  out.appendChild(canvas);
  log(`  saved ${name}.png  ${canvas.width}x${canvas.height}`);
}

async function run() {
  document.getElementById('log').textContent = 'processing...';

  // ---- mining machine -> pod sprite, sized to its 40px collision box
  try {
    const img = await load('/art-src/machine.png');
    const t = keyAndTrim(img);
    await save(fit(t, 60, 44), 'pod');
  } catch (e) { log('  FAIL pod: ' + e.message); }

  // ---- the machine in two pieces, so the drill can be aimed independently
  //      of the hull. Slicing the one-piece sprite always cut through body.
  for (const [src, name, bw, bh] of [
    ['machine_body', 'pod_body', 46, 32],
    ['drill_bit', 'pod_drill', 17, 13],
  ]) {
    try {
      const img = await load(`/art-src/${src}.png`);
      const t = keyAndTrim(img);
      await save(fit(t, bw, bh), name);
    } catch (e) { log(`  FAIL ${name}: ` + e.message); }
  }

  // ---- ore sheet: 4 across, 3 down. Grid order matches MINERALS 0..9.
  try {
    const img = await load('/art-src/ores.png');
    const cw = img.width / 4, ch = img.height / 3;
    const names = [
      'ore_0', 'ore_1', 'ore_2', 'ore_3',
      'ore_4', 'ore_5', 'ore_6', 'ore_7',
      'ore_8', 'ore_9', 'artifact_0', 'rock_0',
    ];
    for (let i = 0; i < 12; i++) {
      const t = keyAndTrim(img, (i % 4) * cw, ((i / 4) | 0) * ch, cw, ch);
      if (!t) { log('  skip ' + names[i] + ' (empty cell)'); continue; }
      await save(fit(t, 34, 34), names[i]);
    }
  } catch (e) { log('  FAIL ores: ' + e.message); }

  // ---- upgrade parts: one sheet per category, subjects found by projection
  //      and taken in reading order, which is the order they ascend in tier.
  for (const [cat, tiers] of [
    ['drills', 7], ['hulls', 7], ['engines', 7],
    ['tanks', 7], ['radiators', 6], ['bays', 6],
  ]) {
    try {
      const img = await load(`/art-src/part_${cat}.png`);
      let items = splitSheet(img);
      log(`  part_${cat}: found ${items.length} subjects, need ${tiers}`);
      if (items.length > tiers) items = dropFragments(items);
      // If still over, the model drew an extra. The last one it draws is
      // reliably the most elaborate, so keep that as the top tier.
      if (items.length > tiers) items = [...items.slice(0, tiers - 1), items[items.length - 1]];
      if (items.length !== tiers) log(`  WARN part_${cat}: using ${items.length} of ${tiers} tiers`);
      for (let i = 0; i < Math.min(tiers, items.length); i++)
        await save(fit(items[i], 54, 54), `part_${cat}_${i}`);
    } catch (e) { log(`  FAIL part_${cat}: ` + e.message); }
  }

  // ---- surface facilities
  for (const n of ['shop_fuel', 'shop_processor', 'shop_repair', 'shop_outfitter']) {
    try {
      const img = await load(`/art-src/${n}.png`);
      const t = keyAndTrim(img);
      await save(fit(t, 150, 120), n + '_t');
    } catch (e) { log(`  FAIL ${n}: ` + e.message); }
  }

  log('\ndone.');
}

run();
    </script>
  </body>
</html>
